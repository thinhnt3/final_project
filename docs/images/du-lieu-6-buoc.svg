<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="392" viewBox="0 0 1080 392" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Sáu bước dựng dữ liệu</title>
<desc id="fig-desc">Tải dữ liệu gốc, ghép Visual Genome với COCO, chuẩn hoá nhãn theo synset, chia tập, xây đồ thị, nhúng CLIP. Mỗi bước ghi file cho bước sau đọc.</desc>
