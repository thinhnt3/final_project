<text x="28.0" y="61.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e" class="f-ink2" >Từ vựng đồ thị, IDF và mọi ngưỡng chỉ tính trên ảnh train. Ảnh test chỉ lấy từ phần test của bản chia Karpathy.</text>
