<text x="28.0" y="61.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e" class="f-ink2" >Phần trên làm một lần cho cả 10.000 ảnh rồi lưu ra đĩa. Phần dưới chạy mỗi khi có một câu truy vấn.</text>
