<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="508" viewBox="0 0 1080 508" font-family='system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif' role="img" aria-labelledby="fig-title fig-desc">
<title id="fig-title">Toàn cảnh pipeline truy hồi</title>
<desc id="fig-desc">Chuẩn bị trước: ảnh qua CLIP thành vector ảnh, đồ thị cảnh qua GraphSAGE thành vector đồ thị. Khi có truy vấn: CLIP văn bản, chọn top-k theo cosine CLIP, tính điểm đồ thị, trộn điểm theo alpha, trả danh sách ảnh kèm relation giải thích.</desc>
