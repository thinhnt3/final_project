<text x="28.0" y="336.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#52514e" class="f-ink2" >Relation đứng đầu, woman → cutting → cake, đúng là hành động mà truy vấn mô tả. Mức giảm rất nhỏ so với điểm 0,4142: phần lớn điểm đồ thị đến từ các đối</text>
<text x="28.0" y="354.1" font-size="12.5" font-weight="400" text-anchor="start" fill="#52514e" class="f-ink2" >tượng. Ablation cho kết quả cùng chiều: bỏ hết relation, R@1 chỉ giảm 0,56 điểm.</text>
