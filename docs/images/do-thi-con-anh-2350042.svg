<text x="668.0" y="464.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e" class="f-ink2" >Vector ban đầu: vector CLIP văn bản của vị từ, ví</text>
<text x="668.0" y="481.4" font-size="12" font-weight="400" text-anchor="start" fill="#52514e" class="f-ink2" >dụ “cutting”. Cạnh đi chủ thể → đỉnh phụ → đối</text>
<text x="668.0" y="498.8" font-size="12" font-weight="400" text-anchor="start" fill="#52514e" class="f-ink2" >tượng.</text>
<text x="28.0" y="544.0" font-size="12" font-weight="400" text-anchor="start" fill="#52514e" class="f-ink2" >Ảnh thật có 15 đối tượng và 6 relation; hình vẽ 7 đối tượng và 4 relation. Hai người phụ nữ trong ảnh gộp thành một đỉnh “woman”.</text>
