<title id="fig-title">Đồ thị con của ảnh 2350042</title>
<desc id="fig-desc">Đỉnh ảnh nối tới các đỉnh đối tượng shirt, woman, cake, candle, knife, girl, chair. Mỗi relation là một đỉnh phụ: woman → wearing → shirt, woman → cutting → cake, candle → on → cake, girl → on → chair.</desc>
