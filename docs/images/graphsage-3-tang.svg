<title id="fig-title">Ba tầng GraphSAGE</title>
<desc id="fig-desc">Sau tầng 1 đỉnh ảnh biết có woman và cake. Sau tầng 2 biết vai của mỗi đối tượng trong relation cutting. Sau tầng 3 biết woman và cake là hai đầu của cùng một relation cutting.</desc>
