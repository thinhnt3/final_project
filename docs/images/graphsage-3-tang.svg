<text x="28.0" y="61.0" font-size="13" font-weight="400" text-anchor="start" fill="#52514e" class="f-ink2" >Đồ thị rút gọn: ảnh → woman, ảnh → cake, woman → (cutting) → cake. Đỉnh tô màu: thông tin đã tới được đỉnh ảnh.</text>
