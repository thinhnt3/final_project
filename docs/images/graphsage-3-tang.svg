<text x="28.0" y="452.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#0b0b0b" class="f-ink" >Mỗi tầng = một SAGEConv theo chiều cạnh + một SAGEConv ngược chiều cạnh, cộng lại. Mỗi SAGEConv: h mới = W·h + W′·trung bình(h của hàng xóm).</text>
<text x="28.0" y="473.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#52514e" class="f-ink2" >Có hướng nên “man riding horse” khác “horse riding man”. ReLU giữa các tầng, không có ReLU sau tầng 3 (vector CLIP có cả số âm).</text>
<text x="28.0" y="494.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#52514e" class="f-ink2" >Sau tầng 3: vector của đỉnh ảnh → tầng chiếu tuyến tính → chuẩn hoá độ dài 1 = vector đồ thị (512 số, cùng không gian với CLIP).</text>
